<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eventos - ZukZuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css.css">
    <style>
        .event-card {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #ffd700;
            transition: all 0.3s;
        }
        .event-card:hover {
            transform: translateX(5px);
            background: #3d3d3d;
        }
        .event-reward {
            color: #ffd700;
            font-weight: bold;
        }
        .event-type {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        .event-type.bienvenida { background: #28a745; }
        .event-type.especial { background: #ffc107; color: #000; }
        .event-type.normal { background: #17a2b8; }
    </style>
</head>
<body class="bg-dark text-white">
    
    <nav class="navbar navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="zukzuk.png" height="45">
            </a>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">🏠 Inicio</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>🎉 Eventos Especiales</h2>
        <p class="text-muted">Participa en eventos y gana recompensas</p>
        
        <div id="listaEventos"></div>
    </div>
    
    <script src="eventos.js"></script>
</body>
</html>
