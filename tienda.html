<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda - ZukZuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css.css">
    <style>
        .shop-item {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            height: 100%;
        }
        .shop-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.2);
        }
        .shop-item img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2ff;
        }
        .shop-price {
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
        }
        .btn-buy {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            font-weight: bold;
        }
        .btn-buy:hover {
            background: #218838;
        }
        .btn-buy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .monedas-display {
            background: #1a1a1a;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-dark text-white">
    
    <nav class="navbar navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="zukzuk.png" height="45">
            </a>
            <div>
                <span class="monedas-display">
                    🪙 <span id="monedasUsuario">0</span>
                </span>
                <a href="index.html" class="btn btn-outline-light btn-sm ms-2">🏠 Inicio</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>🛒 Tienda de Avatares</h2>
        <p class="text-muted">Compra avatares exclusivos con tus monedas</p>
        
        <div class="row" id="listaItems"></div>
    </div>
    
    <script src="tienda.js"></script>
</body>
</html>
