<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mensajes - ZukZuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css.css">
    <style>
        .msg-card {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #00d2ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .msg-card:hover {
            background: #3d3d3d;
            transform: translateX(5px);
        }
        .msg-card.leido {
            opacity: 0.6;
            border-left-color: #666;
        }
        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .msg-fecha {
            color: #888;
            font-size: 12px;
        }
        .tab-btn {
            background: transparent;
            border: 2px solid #444;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            margin: 5px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #00d2ff;
            color: #000;
            border-color: #00d2ff;
        }
    </style>
</head>
<body class="bg-dark text-white">
    
    <nav class="navbar navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="zukzuk.png" height="45">
            </a>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">🏠 Inicio</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>💬 Mensajes</h2>
        
        <div class="mb-3">
            <button class="tab-btn active" id="tabInbox" onclick="cargarMensajes('inbox')">
                📥 Recibidos
            </button>
            <button class="tab-btn" id="tabSent" onclick="cargarMensajes('sent')">
                📤 Enviados
            </button>
            <button class="btn btn-primary ms-3" onclick="nuevoMensaje()">
                ✏️ Nuevo Mensaje
            </button>
        </div>
        
        <div id="listaMensajes"></div>
    </div>
    
    <script src="mensajes.js"></script>
</body>
</html>
