<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil - ZukZuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css.css">
    <style>
        .perfil-card {
            background: #2d2d2d;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00d2ff;
        }
        .btn-editar {
            background: #00d2ff;
            color: #000;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            font-weight: bold;
        }
        .btn-editar:hover {
            background: #ffffff;
            color: #000;
        }
        .btn-amigo {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            font-weight: bold;
        }
        .btn-amigo:hover {
            background: #218838;
        }
        .btn-amigo:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-config {
            background: #ffc107;
            color: #000;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            font-weight: bold;
        }
        .btn-config:hover {
            background: #ffca2c;
        }
    </style>
</head>
<body class="bg-dark text-white">
    
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="zukzuk.png" height="45">
            </a>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">🏠 Inicio</a>
            </div>
        </div>
    </nav>
    
    <!-- CONTENIDO -->
    <div class="container mt-4">
        <div class="row">
            <!-- Perfil -->
            <div class="col-md-4">
                <div class="perfil-card text-center">
                    <img src="default_avatar.png" class="avatar" id="avatar">
                    <h3 id="nombrePerfil" class="mt-3">Cargando...</h3>
                    <p id="biografiaPerfil" class="text-muted">Cargando...</p>
                    <hr>
                    <div class="row">
                        <div class="col-6">
                            <p class="mb-0">⭐ Nivel</p>
                            <h4 id="nivel">0</h4>
                        </div>
                        <div class="col-6">
                            <p class="mb-0">🪙 Monedas</p>
                            <h4 id="monedas">0</h4>
                        </div>
                    </div>
                    <hr>
                    <div class="d-grid gap-2">
                        <button 
                            id="btnEditarPerfil" 
                            class="btn-editar" 
                            onclick="window.location.href='configuracion.html'"
                            style="display:none;"
                        >
                            ⚙️ Configuración
                        </button>
                        <button 
                            id="btnAgregarAmigo" 
                            class="btn-amigo" 
                            onclick="agregarAmigo()"
                            style="display:none;"
                        >
                            ➕ Agregar Amigo
                        </button>

                        <button 
    class="btn btn-primary mt-2"
    onclick="window.location.href='avatar_customizer.html'"
>
    🎨 Crear Personaje
</button>
                    </div>
                </div>
            </div>
            
            <!-- Juegos del usuario -->
            <div class="col-md-8">
                <h4>📁 Juegos de <span id="nombreJuegos">Cargando...</span></h4>
                <div id="juegosUsuario" class="row mt-3"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
