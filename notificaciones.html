<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notificaciones - ZukZuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css.css">
    <style>
        .noti-card {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #00d2ff;
            transition: all 0.3s;
        }
        .noti-card.leida {
            opacity: 0.6;
            border-left-color: #666;
        }
        .noti-card:hover {
            background: #3d3d3d;
        }
        .noti-fecha {
            color: #888;
            font-size: 12px;
        }
        .noti-tipo {
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-dark text-white">
    
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="zukzuk.png" height="45">
            </a>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">🏠 Inicio</a>
            </div>
        </div>
    </nav>
    
    <!-- CONTENIDO -->
    <div class="container mt-4">
        <h2>🔔 Notificaciones</h2>
        <p class="text-muted" id="contadorNotificaciones">0 notificaciones no leídas</p>
        <hr>
        <div id="listaNotificaciones"></div>
    </div>
    
    <script src="notificaciones.js"></script>
</body>
</html>
