services:
  - type: web
    name: zukzuk
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "from backend.database import crear_tablas; crear_tablas()"
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DEBUG
        value: false