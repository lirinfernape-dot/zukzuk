<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Editar Juego</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container mt-5">

<h2>Editar Juego</h2>

<form id="formEditar">

<div class="mb-3">

<label>Nombre</label>

<input
type="text"
class="form-control"
id="nombre">

</div>

<div class="mb-3">

<label>Descripción</label>

<textarea
class="form-control"
id="descripcion"
rows="5"></textarea>

</div>

<div class="mb-3">

<label>Categoría</label>

<input
type="text"
class="form-control"
id="categoria">

</div>


<div class="mb-3">

<label>Nueva versión</label>

<input

type="text"

class="form-control"

id="version"

placeholder="Ejemplo: 1.0.1">

</div>

<div class="mb-3">

<label>Nuevo archivo (.zip)</label>

<input

type="file"

class="form-control"

id="archivo"

accept=".zip">

</div>

<button
class="btn btn-success"
type="submit">

Guardar Cambios

</button>

</form>

</div>

<script src="editarJuego.js"></script>

</body>

</html>
