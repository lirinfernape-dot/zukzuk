<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis Amigos - ZukZuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css.css">
    <style>
        .friend-card {
            background: #2d2d2d;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .friend-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }
        .friend-name {
            color: white;
            font-size: 18px;
            margin-left: 15px;
        }
        .btn-ver-perfil {
            background: #00d2ff;
            color: #000;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .btn-ver-perfil:hover {
            background: #ffffff;
        }
    </style>
</head>
<body class="bg-dark text-white">
    
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="zukzuk.png" height="45">
            </a>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">🏠 Inicio</a>
            </div>
        </div>
    </nav>
    
    <!-- CONTENIDO -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>👥 Mis Amigos</h2>
                <hr>
                <div id="listaAmigos"></div>
            </div>
        </div>
    </div>
    
    <script src="amigos.js"></script>
</body>
</html>
